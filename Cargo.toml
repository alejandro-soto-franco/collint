[package]
name = "collint"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
description = "Detect and auto-fix visual collisions in matplotlib figures"
repository = "https://github.com/alejandro-soto-franco/collint"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28", features = ["abi3-py310"] }
numpy = "0.28"
ndarray = "0.16"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
extension-module = ["pyo3/extension-module"]
